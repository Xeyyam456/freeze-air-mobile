# Release APK GitHub-da yığılır (TikTak layihəsindəki kimi): freeze-air-mobile reposuna hər push-da və ya əl ilə (Actions → Run workflow).
# Bu fayl kök repoda mobile/.github/-dadır; push-all.mjs mobile/-u ayrı repoya köçürəndə .github/ onun kökünə düşür.
# Env: EXPO_PUBLIC_* reponun Secrets-indədir (publishable açar gizli deyil, amma kodda saxlanmır).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Native project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeze-air-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
